apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: st22-shortdump-serving
spec:
  containers:
    - name: st22-ai
      image: <your-docker-user>/st22-ai-gateway:latest
      ports:
        - name: http
          port: 8000
      env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-key
              key: apiKey

  replicas: 1

  resources:
    limits:
      cpu: "1"
      memory: "1Gi"

  protocol: http
  readinessProbe:
    path: /health
    port: 8000
