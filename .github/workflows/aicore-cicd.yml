name: Deploy to SAP AI Core

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login \
            -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t st22-ai-gateway ./python-gateway

      - name: Push Docker image
        run: |
          docker tag st22-ai-gateway <YOUR_DOCKER_REPO>/st22-ai-gateway:latest
          docker push <YOUR_DOCKER_REPO>/st22-ai-gateway:latest

      - name: Trigger AI Core Deployment
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.AICORE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"templateName": "st22-ai-serving"}' \
            ${{ secrets.AICORE_SERVING_URL }}/deployments
